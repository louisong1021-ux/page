<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>预约已提交 | LA Airport Ride</title><link rel="stylesheet" href="./styles.css"></head><body><header class="topbar"><div class="topbar-inner"><a class="brand" href="./"><span class="brand-mark">✈</span><span><strong>LA Airport Ride</strong><small>Booking confirmation</small></span></a><a class="orders-link" href="./account.html">管理订单</a></div></header><main class="account-page"><p class="eyebrow">Booking request received</p><h1>预约请求已提交</h1><p style="color:var(--muted)">这是当前前端演示版的本机预约记录。接入后端后可改为正式订单确认。</p><div id="box" class="booking-card" style="margin-top:18px"></div><div style="display:flex;gap:8px;margin-top:14px"><a class="submit-main" style="text-decoration:none;flex:1" href="./">再创建一单</a><a class="submit-main" style="text-decoration:none;flex:1;background:#fff;color:var(--ink);border:1px solid var(--line)" href="./account.html">管理订单</a></div></main><script>const id=new URLSearchParams(location.search).get("id");const all=JSON.parse(localStorage.getItem("airport-shuttle-bookings")||"[]");const b=all.find(x=>x.id===id);document.getElementById("box").innerHTML=b?'<div class="top"><div><p>预约编号</p><h3>'+b.id+'</h3></div><div class="price">'+(b.quote?"$"+Math.round(b.quote.total):"—")+'</div></div><p>'+b.date+' '+b.time+' · '+(b.direction==="arrival"?"接机":"送机")+'</p><p>'+b.city+' ↔ '+b.airport+'</p><p>'+b.name+' · '+b.phone+'</p><p>状态：'+b.status+'</p>':'<p>没有找到该预约记录。</p>';</script></body></html>

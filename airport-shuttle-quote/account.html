<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的预约 | LA Airport Ride</title><link rel="stylesheet" href="./styles.css"></head><body><header class="topbar"><div class="topbar-inner"><a class="brand" href="./"><span class="brand-mark">✈</span><span><strong>LA Airport Ride</strong><small>My bookings</small></span></a><a class="orders-link" href="./">返回报价</a></div></header><main class="account-page"><p class="eyebrow">My bookings</p><h1>预约记录</h1><p style="color:var(--muted)">当前演示版记录保存在此浏览器 localStorage；接入后端后可跨设备查看。</p><div id="list" class="account-list"></div></main><script>const all=JSON.parse(localStorage.getItem("airport-shuttle-bookings")||"[]");const list=document.getElementById("list");if(!all.length){list.innerHTML='<div class="empty-state">还没有预约记录。<br><br><a href="./">创建第一笔预约</a></div>'}else{list.innerHTML=all.map(b=>'<div class="booking-card"><div class="top"><div><h3>'+b.id+'</h3><p>'+b.status+'</p></div><div class="price">'+(b.quote?"$"+Math.round(b.quote.total):"—")+'</div></div><p>'+b.date+' '+b.time+' · '+(b.direction==="arrival"?"接机":"送机")+'</p><p>'+b.city+' ↔ '+b.airport+' · '+b.passengers+' 人</p><p>'+b.name+' · '+b.phone+'</p><a href="./confirmation.html?id='+encodeURIComponent(b.id)+'">查看详情 →</a></div>').join("")}</script></body></html>

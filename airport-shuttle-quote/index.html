<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>机场接送即时报价</title>
  <style>
    :root{
      --bg:#f7f7f5;--card:#fff;--text:#191919;--muted:#6b7280;--line:#e5e7eb;
      --primary:#111827;--accent:#2563eb;--soft:#eef2ff;--green:#15803d;
      --radius:20px;--shadow:0 12px 35px rgba(17,24,39,.08);
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
    .shell{max-width:1180px;margin:0 auto;padding:22px 18px 48px}
    header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:20px}
    .brand{display:flex;align-items:center;gap:12px}
    .brand-mark{width:44px;height:44px;border-radius:14px;background:var(--primary);color:white;display:grid;place-items:center;font-size:22px}
    h1{font-size:22px;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:3px}
    .badge{padding:8px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;color:var(--muted)}
    .layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(310px,.75fr);gap:20px;align-items:start}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .form-card{padding:18px}.quote-card{padding:20px;position:sticky;top:18px}
    .section{padding:16px 0;border-bottom:1px solid #f0f1f3}.section:first-child{padding-top:0}.section:last-child{border-bottom:0;padding-bottom:0}
    .section-title{font-size:14px;font-weight:700;margin-bottom:10px}
    .toggle{display:grid;grid-template-columns:1fr 1fr;background:#f3f4f6;padding:4px;border-radius:14px}
    .toggle button{border:0;background:transparent;padding:11px;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;color:#6b7280}
    .toggle button.active{background:#111827;color:white;box-shadow:0 2px 8px rgba(0,0,0,.14)}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    label{display:block;font-size:12px;font-weight:700;color:#374151;margin-bottom:6px}
    input,select{width:100%;height:44px;border:1px solid #dcdfe4;border-radius:12px;background:#fff;padding:0 12px;font-size:14px;outline:none}
    input:focus,select:focus{border-color:#94a3b8;box-shadow:0 0 0 3px rgba(148,163,184,.15)}
    .hint{font-size:11px;color:#9ca3af;margin-top:5px}
    .counter{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;border:1px solid #dcdfe4;border-radius:12px;height:44px;overflow:hidden}
    .counter button{height:100%;border:0;background:#f9fafb;font-size:20px;cursor:pointer}.counter span{text-align:center;font-weight:700}
    .checks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .check{border:1px solid #dcdfe4;border-radius:14px;padding:12px;cursor:pointer;user-select:none}
    .check.active{border-color:#111827;background:#f8fafc}.check b{display:block;font-size:13px}.check small{color:var(--muted)}
    .quote-title{font-size:14px;color:var(--muted);margin-bottom:4px}.total{font-size:46px;font-weight:800;letter-spacing:-1.5px;margin:0 0 8px}
    .route{font-size:14px;font-weight:700;margin-bottom:18px}.rows{border-top:1px solid var(--line);padding-top:12px}
    .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:13px}.row span:first-child{color:var(--muted)}.row strong{font-weight:700}
    .divider{height:1px;background:var(--line);margin:8px 0}
    .final{font-size:15px}.final strong{font-size:18px}
    .primary{width:100%;border:0;border-radius:14px;background:var(--primary);color:white;padding:14px 16px;font-weight:800;font-size:15px;cursor:pointer;margin-top:14px}
    .secondary{width:100%;border:1px solid var(--line);border-radius:14px;background:white;padding:12px 16px;font-weight:700;font-size:14px;cursor:pointer;margin-top:8px}
    .note{font-size:11px;color:#9ca3af;line-height:1.55;margin-top:12px}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(max-width:820px){.layout{grid-template-columns:1fr}.quote-card{position:static}.grid3{grid-template-columns:1fr}.checks{grid-template-columns:1fr 1fr}.total{font-size:40px}}
    @media(max-width:560px){header{align-items:flex-start}.badge{display:none}.grid2{grid-template-columns:1fr}.checks{grid-template-columns:1fr}.shell{padding:14px 12px 32px}.form-card,.quote-card{padding:15px}}
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">
      <div class="brand-mark">✈</div>
      <div><h1>机场接送即时报价</h1><div class="sub">Southern California Airport Transportation</div></div>
    </div>
    <div class="badge">MVP · 前端实时估价</div>
  </header>

  <div class="layout">
    <div class="card form-card">
      <div class="section">
        <div class="section-title">1. 服务方向</div>
        <div class="toggle">
          <button id="departureBtn" class="active">送机 Departure</button>
          <button id="arrivalBtn">接机 Arrival</button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">2. 行程</div>
        <div class="grid2">
          <div><label>机场</label><select id="airport"></select></div>
          <div><label>城市 / 区域</label><select id="city"></select></div>
        </div>
        <div style="margin-top:12px">
          <label>详细地址（可选）</label>
          <input id="address" placeholder="例如：123 Main St, Chino Hills, CA 91709" />
          <div class="hint">第一版报价按城市固定价计算；后端版可接地图距离自动估价。</div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">3. 日期与时间</div>
        <div class="grid2">
          <div><label>日期</label><input id="date" type="date" /></div>
          <div><label id="timeLabel">上车时间</label><input id="time" type="time" value="10:00" /></div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">4. 乘客</div>
        <div class="grid3">
          <div><label>人数</label><div class="counter"><button data-counter="passengers" data-delta="-1">−</button><span id="passengersVal">1</span><button data-counter="passengers" data-delta="1">+</button></div></div>
          <div><label>儿童安全座椅</label><div class="counter"><button data-counter="carSeats" data-delta="-1">−</button><span id="carSeatsVal">0</span><button data-counter="carSeats" data-delta="1">+</button></div></div>
          <div><label>Booster</label><div class="counter"><button data-counter="boosters" data-delta="-1">−</button><span id="boostersVal">0</span><button data-counter="boosters" data-delta="1">+</button></div></div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">5. 其他服务</div>
        <div class="checks">
          <div class="check" id="signCheck"><b>举牌接机</b><small>+$20</small></div>
          <div class="check" id="internationalCheck"><b>国际航班</b><small>影响深夜接机费</small></div>
          <div class="check" id="firstOrderCheck"><b>首次在线预约</b><small>-$10 示例优惠</small></div>
        </div>
      </div>
    </div>

    <div class="card quote-card">
      <div class="quote-title">即时估价</div>
      <div class="total" id="total">$0</div>
      <div class="route" id="route">—</div>
      <div class="rows" id="breakdown"></div>
      <button class="primary" id="copyBtn">复制报价</button>
      <button class="secondary" id="resetBtn">重置</button>
      <div class="note">此页面为第一版报价工具。价格、附加费和城市表均可在代码中修改；暂不保存客户信息，也不处理付款。</div>
    </div>
  </div>
</div>
<div class="toast" id="toast">已复制</div>

<script>
const PRICE_TABLE = {
  "Chino Hills": {LAX:115, ONT:80, SNA:90},
  "Diamond Bar": {LAX:100, ONT:80, SNA:90},
  "Rowland Heights": {LAX:100, ONT:80, SNA:90},
  "Walnut": {LAX:100, ONT:80, SNA:90},
  "Pomona": {LAX:115, ONT:80, SNA:100},
  "Rancho Cucamonga": {LAX:125, ONT:85, SNA:120},
  "Pasadena": {LAX:100, ONT:90, BUR:90},
  "Irvine": {LAX:120, ONT:110, SNA:80, LGB:110},
  "Tustin": {LAX:120, ONT:110, SNA:80, LGB:110},
  "Los Angeles": {LAX:100, ONT:100},
  "Santa Monica": {LAX:100},
  "Anaheim": {LAX:115, ONT:100},
  "Fullerton": {LAX:100, ONT:90, SNA:90},
  "West Covina": {LAX:100, ONT:85, SNA:90},
  "Arcadia": {LAX:100, ONT:90, BUR:90},
  "San Gabriel": {LAX:90, ONT:90},
  "Monterey Park": {LAX:90, ONT:90},
  "Corona": {LAX:135, ONT:95},
  "San Diego": {LAX:280, ONT:260}
};
const AIRPORTS = ["LAX","ONT","SNA","LGB","BUR"];
const state = {direction:"departure", passengers:1, carSeats:0, boosters:0, holdSign:false, international:false, firstOrder:false};

const $ = id => document.getElementById(id);
function money(n){ return "$" + Math.round(n); }
function setToday(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); $("date").value=d.toISOString().slice(0,10); }
function populate(){
  $("airport").innerHTML=AIRPORTS.map(a=>`<option value="${a}">${a}</option>`).join("");
  $("city").innerHTML=Object.keys(PRICE_TABLE).sort().map(c=>`<option value="${c}">${c}</option>`).join("");
  $("city").value="Chino Hills";
}
function hourFloat(){
  const v=$("time").value||"10:00"; const [h,m]=v.split(":").map(Number); return h+m/60;
}
function timeFee(){
  const h=hourFloat();
  if(state.direction==="departure"){
    if(h>=2&&h<3) return 60;
    if(h>=3&&h<4) return 50;
    if(h>=4&&h<5) return 40;
    if(h>=5&&h<6) return 30;
    if(h>=6&&h<7) return 20;
    if(h>=7&&h<9) return 10;
    return 0;
  }
  if(h>=5&&h<6) return 20;
  if(h>=6&&h<8) return 10;
  if(h>=0&&h<1) return 40;
  if(h>=1&&h<2) return 50;
  if(h>=21&&h<22.5) return state.international?10:0;
  if(h>=22.5&&h<23.5) return 20;
  if(h>=23.5) return 30;
  return 0;
}
function calculate(){
  const city=$("city").value, airport=$("airport").value;
  const base=(PRICE_TABLE[city]||{})[airport] ?? null;
  const rows=[];
  if(base===null){
    $("total").textContent="需询价";
    $("route").textContent=`${city} ↔ ${airport}`;
    $("breakdown").innerHTML='<div class="row"><span>该路线未设置固定价</span><strong>Contact us</strong></div>';
    return;
  }
  const passengerFee=Math.max(0,state.passengers-1)*5;
  const arrivalFee=state.direction==="arrival"?5:0;
  const tFee=timeFee();
  const seatFee=state.carSeats*5;
  const boosterFee=state.boosters*5;
  const signFee=state.holdSign?20:0;
  const discount=state.firstOrder?10:0;
  const total=Math.max(0,base+passengerFee+arrivalFee+tFee+seatFee+boosterFee+signFee-discount);

  rows.push(["基础车费",base]);
  if(passengerFee) rows.push(["额外乘客",passengerFee]);
  if(arrivalFee) rows.push(["接机费",arrivalFee]);
  if(tFee) rows.push(["时间附加费",tFee]);
  if(seatFee) rows.push(["儿童安全座椅",seatFee]);
  if(boosterFee) rows.push(["Booster",boosterFee]);
  if(signFee) rows.push(["举牌服务",signFee]);
  if(discount) rows.push(["首次在线优惠",-discount]);

  $("total").textContent=money(total);
  $("route").textContent=`${state.direction==="departure"?"送机":"接机"} · ${city} ↔ ${airport}`;
  $("breakdown").innerHTML=rows.map(([k,v])=>`<div class="row"><span>${k}</span><strong>${v<0?"-":""}${money(Math.abs(v))}</strong></div>`).join("")+
    `<div class="divider"></div><div class="row final"><span>预计总价</span><strong>${money(total)}</strong></div>`;
}
function toggleDirection(dir){
  state.direction=dir;
  $("departureBtn").classList.toggle("active",dir==="departure");
  $("arrivalBtn").classList.toggle("active",dir==="arrival");
  $("timeLabel").textContent=dir==="departure"?"上车时间":"航班到达时间";
  calculate();
}
function updateCounter(key,delta){
  const limits={passengers:[1,7],carSeats:[0,4],boosters:[0,4]}, [min,max]=limits[key];
  state[key]=Math.max(min,Math.min(max,state[key]+delta));
  $(key+"Val").textContent=state[key]; calculate();
}
document.querySelectorAll("[data-counter]").forEach(b=>b.addEventListener("click",()=>updateCounter(b.dataset.counter,Number(b.dataset.delta))));
$("departureBtn").onclick=()=>toggleDirection("departure");
$("arrivalBtn").onclick=()=>toggleDirection("arrival");
["airport","city","time","date","address"].forEach(id=>$(id).addEventListener("input",calculate));
[
  ["signCheck","holdSign"],["internationalCheck","international"],["firstOrderCheck","firstOrder"]
].forEach(([id,key])=>$(id).onclick=()=>{state[key]=!state[key];$(id).classList.toggle("active",state[key]);calculate();});
$("copyBtn").onclick=async()=>{
  const text=`${$("route").textContent}\n日期：${$("date").value} ${$("time").value}\n预计价格：${$("total").textContent}\n地址：${$("address").value||"未填写"}`;
  await navigator.clipboard.writeText(text);
  $("toast").classList.add("show"); setTimeout(()=>$("toast").classList.remove("show"),1300);
};
$("resetBtn").onclick=()=>{
  state.direction="departure";state.passengers=1;state.carSeats=0;state.boosters=0;state.holdSign=false;state.international=false;state.firstOrder=false;
  ["passengers","carSeats","boosters"].forEach(k=>$(k+"Val").textContent=state[k]);
  ["signCheck","internationalCheck","firstOrderCheck"].forEach(id=>$(id).classList.remove("active"));
  $("airport").value="LAX";$("city").value="Chino Hills";$("time").value="10:00";$("address").value="";setToday();toggleDirection("departure");
};
populate();setToday();calculate();
</script>
</body>
</html>
